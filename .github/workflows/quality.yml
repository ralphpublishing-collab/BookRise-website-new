name: BookRise quality checks

on:
  push:
    branches:
      - main
      - 'quality-audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify syntax and project assets
        run: npm run build
      - name: Run Worker smoke tests
        run: npm test
