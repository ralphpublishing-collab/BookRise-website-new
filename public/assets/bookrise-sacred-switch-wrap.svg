<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><linearGradient id="n" x2="1" y2="1"><stop stop-color="#06152b"/><stop offset="1" stop-color="#1d3955"/></linearGradient><linearGradient id="g" x2="0" y2="1"><stop stop-color="#f7e5bb"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#92652c"/></linearGradient><linearGradient id="r" x2="1" y2="1"><stop stop-color="#34485b"/><stop offset=".55" stop-color="#f1dfc2"/><stop offset="1" stop-color="#d5a56c"/></linearGradient></defs><rect width="1500" height="1000" fill="#eeeae2"/><rect width="500" height="1000" fill="url(#n)"/><rect x="500" width="95" height="1000" fill="#091b30"/><rect x="595" width="905" height="1000" fill="url(#r)"/><path d="M0 30H500M0 970H500M595 30H1500" stroke="url(#g)" stroke-width="4"/><text x="250" y="125" fill="#d4af37" font-family="Georgia" font-size="30" text-anchor="middle">DISCOVER THE DIVINE RHYTHM</text><text x="250" y="170" fill="#d4af37" font-family="Georgia" font-size="27" text-anchor="middle">OF YOUR LIFE'S NEXT SEASON</text><text x="250" y="280" fill="#fff" font-family="Georgia" font-size="25" text-anchor="middle">Life unfolds step by step,</text><text x="250" y="325" fill="#fff" font-family="Georgia" font-size="25" text-anchor="middle">season by season.</text><text x="250" y="440" fill="#d4af37" font-family="Georgia" font-size="38" text-anchor="middle">THE SACRED SWITCH</text><text x="250" y="500" fill="#fff" font-family="Georgia" font-size="24" text-anchor="middle">From grabbing to giving</text><text x="250" y="540" fill="#fff" font-family="Georgia" font-size="24" text-anchor="middle">with purpose and faith.</text><path d="M90 620H410" stroke="url(#g)" stroke-width="4"/><text x="250" y="700" fill="#e8d8b8" font-family="Georgia" font-size="27" text-anchor="middle">YOUR NEXT SEASON</text><text x="250" y="742" fill="#e8d8b8" font-family="Georgia" font-size="27" text-anchor="middle">BEGINS WITH A CHOICE</text><text x="250" y="910" fill="#d4af37" font-family="Georgia" font-size="25" text-anchor="middle">JEFF HARLOW &amp;</text><text x="250" y="950" fill="#d4af37" font-family="Georgia" font-size="25" text-anchor="middle">JENNIFER FREEMAN</text><text x="548" y="520" fill="#d4af37" font-family="Georgia" font-size="55" text-anchor="middle" transform="rotate(-90 548 520)">THE SACRED SWITCH</text><text x="1050" y="140" fill="#172a43" font-family="Georgia" font-size="30" letter-spacing="5" text-anchor="middle">GOD'S PLAN HAS STAGES, NOT SHORTCUTS</text><text x="1050" y="280" fill="#132b48" font-family="Georgia" font-size="90" text-anchor="middle">THE SACRED</text><text x="1050" y="390" fill="#b18a42" font-family="Georgia" font-size="110" text-anchor="middle">SWITCH</text><rect x="950" y="470" width="200" height="230" rx="15" fill="#a47a37" stroke="#f5d68e" stroke-width="12"/><rect x="1010" y="515" width="80" height="140" rx="8" fill="#e9d6a7" stroke="#624821" stroke-width="8"/><path d="M1050 545v70" stroke="#75552c" stroke-width="18" stroke-linecap="round"/><text x="1050" y="790" fill="#182e48" font-family="Arial" font-size="28" letter-spacing="4" text-anchor="middle">THE SUBTLE SHIFT</text><text x="1050" y="835" fill="#182e48" font-family="Arial" font-size="28" letter-spacing="4" text-anchor="middle">FROM GRABBING TO GIVING</text><text x="1050" y="925" fill="#132b48" font-family="Georgia" font-size="42" letter-spacing="6" text-anchor="middle">JEFF HARLOW</text><text x="1050" y="965" fill="#132b48" font-family="Georgia" font-size="28" text-anchor="middle">&amp; JENNIFER FREEMAN</text></svg>